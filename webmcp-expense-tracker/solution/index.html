<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Expense Tracker</h1>
    <p class="total">Total <strong id="total">0.00</strong> USD</p>
  </header>

  <main>
    <section class="card">
      <h2>Add expense</h2>
      <form id="expense-form">
        <input name="title" placeholder="Coffee" required>
        <input name="amount" type="number" step="0.01" min="0.01" placeholder="4.50" required>
        <select name="category">
          <option value="food">Food</option>
          <option value="transport">Transport</option>
          <option value="shopping">Shopping</option>
          <option value="bills">Bills</option>
          <option value="other">Other</option>
        </select>
        <input name="date" type="date">
        <button type="submit">Add</button>
      </form>
    </section>

    <section class="card">
      <h2>Expenses</h2>
      <ul id="expense-list"></ul>
    </section>

    <section class="card">
      <h2>Currency converter</h2>
      <iframe id="converter" src="converter/" title="Currency converter" allow="tools"></iframe>
    </section>
  </main>

  <script src="app.js"></script>
  <script src="webmcp.js"></script>
</body>
</html>
